<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="286" viewBox="0 0 1100 286" role="img" aria-label="Social Media Downloader App terminal demonstration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b0f14"/>
  <rect x="18" y="18" width="1064" height="250" rx="12" fill="url(#bg)" stroke="#30363d" filter="url(#shadow)"/>
  <circle cx="46" cy="43" r="7" fill="#ff5f56"/>
  <circle cx="70" cy="43" r="7" fill="#ffbd2e"/>
  <circle cx="94" cy="43" r="7" fill="#27c93f"/>
  <text x="128" y="48" fill="#f7c948" font-size="17" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Social Media Downloader App</text>
  <line x1="18" y1="62" x2="1082" y2="62" stroke="#30363d"/>
  <text x="26" y="70" fill="#d6e7ff" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">PS&gt; python .\social_media_downloader.py &quot;https://example.com/media&quot; --mode video</text>
<text x="26" y="96" fill="#8bd5ff" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">Checking supported extractor with yt-dlp...</text>
<text x="26" y="122" fill="#8bd5ff" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">Mode: best-quality video + best audio</text>
<text x="26" y="148" fill="#c9d1d9" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">[download] 100% of 24.8MiB in 00:12</text>
<text x="26" y="174" fill="#7ee787" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">Saved to downloads\example\sample-video.mp4</text>
<text x="26" y="200" fill="#d6e7ff" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">PS&gt; python .\social_media_downloader.py &quot;URL&quot; --mode audio --audio-format mp3</text>
<text x="26" y="226" fill="#7ee787" font-size="16" font-family="Cascadia Mono, Consolas, Menlo, monospace">Audio extract complete: downloads\example\sample-audio.mp3</text>
</svg>
